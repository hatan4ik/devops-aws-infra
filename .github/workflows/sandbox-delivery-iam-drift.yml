name: Sandbox delivery IAM drift detection

on:
  schedule:
    - cron: '53 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-delivery-iam-drift
  cancel-in-progress: false

jobs:
  drift:
    name: sandbox_delivery_iam_drift
    uses: ./.github/workflows/_terraform-root-drift.yml
    with:
      root_directory: infra/active/roots/sandbox-delivery/us-east-2/global
      aws_region: us-east-2
      environment: dev
      role_variable: AWS_SANDBOX_DELIVERY_IAM_DRIFT_ROLE_ARN
      session_prefix: sandbox-delivery-iam
      job_name: sandbox_delivery_iam_drift
