name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform_quality:
    name: terraform_quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Read the repository Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0

      - name: Reuse Terraform provider packages within this job
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint .github/workflows/*.yml

      - name: Verify repository-local Markdown links
        run: scripts/check-markdown-links.rb docs

      - name: Validate Terraform modules and roots without cloud credentials
        run: scripts/validate-terraform-quality.sh

      - name: Run Checkov policy checks
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # pinned upstream commit
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: false

      - name: Run Trivy HIGH and CRITICAL IaC checks
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned upstream commit
        with:
          scan-type: config
          scan-ref: infra
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Verify reusable-pipeline source boundaries
        run: |
          set -euo pipefail
          scripts/workflow-policy/check-action-pins.sh .github/workflows
          ruby scripts/workflow-policy/validate-workflows.rb
