name: terraform-quality

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/validate-terraform-quality.sh"
      - "scripts/verify-adr-boundary.sh"
      - "docs/adr/**"
      - "docs/traceability.md"
      - "docs/walkthrough.md"
      - "docs/architecture/phase-3-summary.md"
      - "docs/architecture/phase-4-repositories.md"
      - "docs/architecture/phase-6-7-traceability.md"
      - "docs/architecture/legacy-state-bootstrap.md"
      - "docs/book/12-pre-deployment-checklist.md"
      - "docs/runbooks/bootstrap-aws-access.md"
      - "docs/runbooks/region-failover.md"
      - "README.md"
      - "modules/**"
      - "roots/**"
      - ".github/workflows/**"
      - "automation/terraform-pipelines/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/validate-terraform-quality.sh"
      - "scripts/verify-adr-boundary.sh"
      - "docs/adr/**"
      - "docs/traceability.md"
      - "docs/walkthrough.md"
      - "docs/architecture/phase-3-summary.md"
      - "docs/architecture/phase-4-repositories.md"
      - "docs/architecture/phase-6-7-traceability.md"
      - "docs/architecture/legacy-state-bootstrap.md"
      - "docs/book/12-pre-deployment-checklist.md"
      - "docs/runbooks/bootstrap-aws-access.md"
      - "docs/runbooks/region-failover.md"
      - "README.md"
      - "modules/**"
      - "roots/**"
      - ".github/workflows/**"
      - "automation/terraform-pipelines/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform_quality:
    name: terraform_quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Terraform 1.7.5
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0

      - name: Reuse Terraform provider packages within this job
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"

      - name: Validate Terraform modules and roots without cloud credentials
        run: scripts/validate-terraform-quality.sh

      - name: Run Checkov policy checks
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # pinned upstream commit
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: false

      - name: Run Trivy HIGH and CRITICAL IaC checks
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned upstream commit
        with:
          scan-type: config
          scan-ref: terraform
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Verify generated Terraform documentation
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          find-dir: terraform/modules
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"
          git-push: "false"

      - name: Verify reusable-pipeline source boundaries
        run: |
          set -euo pipefail
          automation/terraform-pipelines/scripts/check-action-pins.sh .github/workflows
          cd automation/terraform-pipelines
          ruby scripts/validate-workflows.rb
          ruby scripts/check-reusable-contracts.rb
          scripts/check-action-pins.sh .github/workflows
