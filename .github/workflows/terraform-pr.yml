name: Terraform GitOps policy checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy-checks:
    name: GitOps policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate reusable workflow structure and action pins
        run: |
          set -euo pipefail
          scripts/workflow-policy/check-action-pins.sh .github/workflows
          ruby scripts/workflow-policy/validate-workflows.rb

      - name: Assert the canonical delivery boundary
        run: scripts/verify-adr-boundary.sh
