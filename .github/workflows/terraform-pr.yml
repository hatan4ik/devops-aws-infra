name: Terraform GitOps policy checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy-checks:
    name: GitOps policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate reusable workflow structure and action pins
        run: |
          set -euo pipefail
          automation/terraform-pipelines/scripts/check-action-pins.sh .github/workflows
          cd automation/terraform-pipelines
          ruby scripts/validate-workflows.rb
          ruby scripts/check-reusable-contracts.rb
          scripts/check-action-pins.sh .github/workflows

      - name: Assert no root workflow can access AWS before delivery setup
        run: |
          set -euo pipefail
          if rg --hidden -g '!terraform-pr.yml' 'id-token:[[:space:]]*write|configure-aws-credentials|terraform apply|terraform plan' .github/workflows; then
            echo "Root workflows must remain credential-free until the approved OIDC/backend setup exists." >&2
            exit 1
          fi
