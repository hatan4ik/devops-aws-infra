name: 'Terraform PR Checks'

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for AWS OIDC
  contents: read  # Required to checkout code
  pull-requests: write # Required to post PR comments

jobs:
  terraform-checks:
    name: 'Terraform Validation & Plan'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false # Fail on HIGH/CRITICAL unless suppressed
          skip_check: CKV_AWS_1 # Example skip, adjust per actual rules

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }} # Replace with actual Dev role ARN
          aws-region: us-east-1

      # Note: Actual plan requires initialized backend, this is a placeholder structure
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test
        run: terraform test
        continue-on-error: true # Will be false once tests are written
