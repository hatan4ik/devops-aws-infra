name: Sandbox delivery IAM plan

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sandbox-delivery-iam-plan.yml
      - .github/workflows/_terraform-root-plan.yml
      - infra/active/roots/sandbox-delivery/us-east-2/global/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-delivery-iam-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates fork rejection (`github.event.pull_request.head.repo.full_name == github.repository`) and terraform plan execution to the reusable workflow.
  plan:
    name: sandbox_delivery_iam_plan
    uses: ./.github/workflows/_terraform-root-plan.yml
    with:
      root_directory: infra/active/roots/sandbox-delivery/us-east-2/global
      aws_region: us-east-2
      role_variable: AWS_SANDBOX_DELIVERY_IAM_PLAN_ROLE_ARN
      session_prefix: sandbox-delivery-iam
      job_name: sandbox_delivery_iam_plan
