name: Sandbox network drift detection

on:
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-network-drift
  cancel-in-progress: false

jobs:
  # Reusable contract: Require the protected dev environment drift role variable and run terraform plan -detailed-exitcode without remediation.
  drift:
    name: sandbox_network_drift
    uses: ./.github/workflows/_terraform-root-drift.yml
    with:
      root_directory: infra/active/roots/sandbox-network/us-east-2/dev
      aws_region: us-east-2
      environment: dev
      role_variable: AWS_SANDBOX_NETWORK_DRIFT_ROLE_ARN
      session_prefix: sandbox-network
      job_name: sandbox_network_drift
