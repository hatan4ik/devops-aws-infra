name: Sandbox workload drift detection

on:
  schedule:
    - cron: '38 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-workload-drift
  cancel-in-progress: false

jobs:
  drift:
    name: sandbox_workload_drift
    runs-on: ubuntu-24.04
    environment: dev
    defaults:
      run:
        working-directory: infra/active/roots/sandbox-workload/us-east-2/dev
    steps:
      - name: Check out protected main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Require the protected dev environment workload drift role variable
        env:
          AWS_SANDBOX_WORKLOAD_DRIFT_ROLE_ARN: ${{ vars.AWS_SANDBOX_WORKLOAD_DRIFT_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_SANDBOX_WORKLOAD_DRIFT_ROLE_ARN"

      - name: Read the repository Terraform version
        id: terraform-version
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Exchange GitHub OIDC for the protected dev workload drift role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_WORKLOAD_DRIFT_ROLE_ARN }}
          role-session-name: sandbox-workload-drift-${{ github.run_id }}
          aws-region: us-east-2
          mask-aws-account-id: true

      - name: Initialize the dedicated remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl

      - name: Fail visibly when drift is detected; never remediate automatically
        run: terraform plan -detailed-exitcode -input=false -lock-timeout=5m -var-file=terraform.tfvars
