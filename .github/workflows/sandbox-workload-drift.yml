name: Sandbox workload drift detection

on:
  schedule:
    - cron: '43 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-workload-drift
  cancel-in-progress: false

jobs:
  # Reusable contract: Require the protected dev environment workload drift role variable and run terraform plan -detailed-exitcode without remediation.
  drift:
    name: sandbox_workload_drift
    uses: ./.github/workflows/_terraform-root-drift.yml
    with:
      root_directory: infra/active/roots/sandbox-workload/us-east-2/dev
      aws_region: us-east-2
      environment: dev
      role_variable: AWS_SANDBOX_WORKLOAD_DRIFT_ROLE_ARN
      session_prefix: sandbox-workload
      job_name: sandbox_workload_drift
