name: Sandbox network plan

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sandbox-network-plan.yml
      - .github/workflows/_terraform-root-plan.yml
      - infra/active/roots/sandbox-network/us-east-2/dev/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-network-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates fork rejection (`github.event.pull_request.head.repo.full_name == github.repository`) and terraform plan execution to the reusable workflow.
  plan:
    name: sandbox_network_plan
    uses: ./.github/workflows/_terraform-root-plan.yml
    with:
      root_directory: infra/active/roots/sandbox-network/us-east-2/dev
      aws_region: us-east-2
      role_variable: AWS_SANDBOX_NETWORK_PLAN_ROLE_ARN
      session_prefix: sandbox-network
      job_name: sandbox_network_plan
