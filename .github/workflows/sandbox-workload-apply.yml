name: Apply sandbox workload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type apply to approve this reviewed dev-only Terraform apply.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-workload-dev-apply
  cancel-in-progress: false

jobs:
  # Reusable contract: Require the protected dev environment workload apply role variable and run terraform apply only after a protected-main re-plan.
  apply:
    name: sandbox_workload_apply
    if: inputs.confirm == 'apply'
    uses: ./.github/workflows/_terraform-root-apply.yml
    with:
      root_directory: infra/active/roots/sandbox-workload/us-east-2/dev
      aws_region: us-east-2
      environment: dev
      role_variable: AWS_SANDBOX_WORKLOAD_APPLY_ROLE_ARN
      session_prefix: sandbox-workload
      job_name: sandbox_workload_apply
      verify_ecs_services: true
