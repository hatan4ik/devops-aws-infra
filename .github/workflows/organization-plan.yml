name: Organization control-plane plan

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-plan.yml
      - .github/workflows/_terraform-root-plan.yml
      - infra/active/roots/organization/global/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: organization-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates fork rejection (`github.event.pull_request.head.repo.full_name == github.repository`) and terraform plan execution to the reusable workflow.
  plan:
    name: organization_plan
    uses: ./.github/workflows/_terraform-root-plan.yml
    with:
      root_directory: infra/active/roots/organization/global
      aws_region: us-east-2
      role_variable: AWS_ORGANIZATION_PLAN_ROLE_ARN
      session_prefix: organization
      job_name: organization_plan
      backend_mode: ephemeral
      state_bucket_variable: AWS_ORGANIZATION_STATE_BUCKET
      state_kms_key_variable: AWS_ORGANIZATION_STATE_KMS_KEY_ARN
      state_lock_table_variable: AWS_ORGANIZATION_STATE_LOCK_TABLE
