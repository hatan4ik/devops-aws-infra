name: Organization control-plane drift detection

on:
  schedule:
    - cron: '41 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: organization-drift
  cancel-in-progress: false

jobs:
  # Reusable contract: run terraform plan -detailed-exitcode without remediation.
  drift:
    name: organization_drift
    uses: ./.github/workflows/_terraform-root-drift.yml
    with:
      root_directory: infra/active/roots/organization/global
      aws_region: us-east-2
      environment: dev
      role_variable: AWS_ORGANIZATION_DRIFT_ROLE_ARN
      session_prefix: organization
      job_name: organization_drift
      backend_mode: ephemeral
      state_bucket_variable: AWS_ORGANIZATION_STATE_BUCKET
      state_kms_key_variable: AWS_ORGANIZATION_STATE_KMS_KEY_ARN
      state_lock_table_variable: AWS_ORGANIZATION_STATE_LOCK_TABLE
