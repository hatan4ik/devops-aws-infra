name: Organization control-plane drift detection

on:
  schedule:
    - cron: '41 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: organization-drift
  cancel-in-progress: false

jobs:
  drift:
    name: organization_drift
    runs-on: ubuntu-24.04
    environment: dev
    defaults:
      run:
        working-directory: terraform/roots/organization/global
    steps:
      - name: Check out protected main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Require the environment drift role and state variables
        env:
          DRIFT_ROLE_ARN: ${{ vars.AWS_ORGANIZATION_DRIFT_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_ORGANIZATION_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.AWS_ORGANIZATION_STATE_KMS_KEY_ARN }}
          STATE_LOCK_TABLE: ${{ vars.AWS_ORGANIZATION_STATE_LOCK_TABLE }}
        run: |
          set -euo pipefail
          test -n "$DRIFT_ROLE_ARN"
          test -n "$STATE_BUCKET"
          test -n "$STATE_KMS_KEY_ARN"
          test -n "$STATE_LOCK_TABLE"

      - name: Read the repository Terraform version
        id: terraform-version
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Exchange GitHub OIDC for the organization drift role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ORGANIZATION_DRIFT_ROLE_ARN }}
          role-session-name: organization-drift-${{ github.run_id }}
          aws-region: us-east-2
          mask-aws-account-id: true

      - name: Write ephemeral remote-state configuration
        env:
          STATE_BUCKET: ${{ vars.AWS_ORGANIZATION_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.AWS_ORGANIZATION_STATE_KMS_KEY_ARN }}
          STATE_LOCK_TABLE: ${{ vars.AWS_ORGANIZATION_STATE_LOCK_TABLE }}
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF
          bucket         = "${STATE_BUCKET}"
          key            = "gitops/organization/global/terraform.tfstate"
          region         = "us-east-2"
          dynamodb_table = "${STATE_LOCK_TABLE}"
          encrypt        = true
          kms_key_id     = "${STATE_KMS_KEY_ARN}"
          EOF

      - name: Initialize the dedicated remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl

      - name: Fail visibly when drift is detected; never remediate automatically
        run: terraform plan -detailed-exitcode -input=false -lock-timeout=5m -var-file=terraform.tfvars
