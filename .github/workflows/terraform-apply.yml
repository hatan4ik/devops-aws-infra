name: Delivery preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery_not_enabled:
    name: Delivery not enabled
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the delivery gate
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS delivery is intentionally disabled in this source repository."
          echo "ADR 0012 requires a protected environment, approved backend, and scoped GitHub OIDC role in the target delivery repository."
          echo "Use tooling/pipeline-templates only after those prerequisites have been verified."
          exit 1
