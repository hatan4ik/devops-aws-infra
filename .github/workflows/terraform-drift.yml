name: Terraform drift preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-preflight:
    name: Drift preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Explain the drift gate
        run: |
          set -euo pipefail
          echo "Scheduled drift detection is intentionally disabled until a read-only OIDC role, backend configuration, per-root caller, and alert route are verified."
          echo "The reviewed reusable workflow reports drift and never remediates it automatically."
          exit 1
