name: 'Terraform Drift Detection'

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 08:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write # To create an issue if drift is found

jobs:
  drift-detection:
    name: 'Check for Drift'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', env.environment)] }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Detailed Exitcode)
        id: plan
        run: terraform plan -detailed-exitcode
        continue-on-error: true

      - name: Create Issue on Drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Infrastructure Drift Detected in ${{ matrix.environment }}`,
              body: `Drift has been detected in the ${{ matrix.environment }} environment. Please review the GitHub Actions run for more details.`
            })

