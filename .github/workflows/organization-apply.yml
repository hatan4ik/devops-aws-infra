name: Apply Organization control plane

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type apply to approve the reviewed Organizations root apply.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: organization-landing-zone-apply
  cancel-in-progress: false

jobs:
  # The reusable apply workflow checks github.event.repository.default_branch and runs terraform apply only after its protected-main re-plan.
  apply:
    name: organization_apply
    if: inputs.confirm == 'apply'
    uses: ./.github/workflows/_terraform-root-apply.yml
    with:
      root_directory: infra/active/roots/organization/global
      aws_region: us-east-2
      environment: landing-zone
      role_variable: AWS_ORGANIZATION_LANDING_ZONE_ROLE_ARN
      session_prefix: organization
      job_name: organization_apply
      backend_mode: ephemeral
      state_bucket_variable: AWS_ORGANIZATION_STATE_BUCKET
      state_kms_key_variable: AWS_ORGANIZATION_STATE_KMS_KEY_ARN
      state_lock_table_variable: AWS_ORGANIZATION_STATE_LOCK_TABLE
