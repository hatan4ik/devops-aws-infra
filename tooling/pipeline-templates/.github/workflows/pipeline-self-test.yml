name: pipeline-self-test

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow_lint:
    name: workflow_lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate workflow YAML and shell syntax
        run: |
          set -euo pipefail
          ruby scripts/validate-workflows.rb
          while IFS= read -r script; do bash -n "$script"; done < <(rg --files scripts -g '*.sh' | sort)

  action_pin_policy:
    name: action_pin_policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Reject mutable action references
        run: scripts/check-action-pins.sh .github/workflows

  reusable_workflow_test:
    name: reusable_workflow_test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Verify credential and execution boundaries
        run: ruby scripts/check-reusable-contracts.rb

  security_scan:
    name: security_scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Scan workflow configuration
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned upstream commit
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"
