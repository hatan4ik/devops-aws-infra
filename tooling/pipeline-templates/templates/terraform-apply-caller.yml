# Template only. Trigger policy is deliberately omitted: the owning repository
# must choose a protected main/release trigger after change-management approval.
# The reusable workflow itself requires a dev, staging, or prod environment.
name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment.
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: <org>/terraform-pipelines/.github/workflows/terraform-apply.yml@<FULL_40_CHAR_COMMIT_SHA>
    with:
      working_directory: <ROOT_DIRECTORY>
      environment: ${{ inputs.environment }}
      aws_region: <AWS_REGION>
      aws_apply_role_arn: <APPLY_ROLE_ARN>
    secrets:
      backend_config_b64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
