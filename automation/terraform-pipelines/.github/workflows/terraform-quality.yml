name: terraform-quality

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing one Terraform module or root.
        required: true
        type: string
      terraform_version:
        description: Terraform CLI version satisfying the repository constraint.
        required: false
        default: 1.7.5
        type: string
      check_docs:
        description: Render terraform-docs and fail when a module README is stale.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out immutable caller revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Check canonical formatting
        run: terraform fmt -check -recursive -no-color

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0

      - name: Lint Terraform
        run: |
          tflint --init
          tflint

      - name: Run credential-free Terraform tests
        run: terraform test -no-color

      - name: Run Checkov policy checks
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # pinned upstream commit
        with:
          directory: ${{ inputs.working_directory }}
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: false

      - name: Run Trivy IaC checks
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned upstream commit
        with:
          scan-type: config
          scan-ref: ${{ inputs.working_directory }}
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Check generated module documentation
        if: inputs.check_docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ inputs.working_directory }}
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"
          git-push: "false"
