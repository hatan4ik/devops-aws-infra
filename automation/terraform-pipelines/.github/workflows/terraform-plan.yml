name: terraform-plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: Terraform root directory to plan.
        required: true
        type: string
      aws_region:
        description: AWS Region used only to obtain the caller's OIDC session.
        required: true
        type: string
      aws_plan_role_arn:
        description: Dedicated least-privilege Terraform plan role ARN.
        required: true
        type: string
      base_ref:
        description: Immutable base commit SHA for the cost-diff plan.
        required: true
        type: string
      pull_request_number:
        description: Pull request number for the cost-diff comment.
        required: true
        type: number
      terraform_version:
        description: Terraform CLI version satisfying the repository constraint.
        required: false
        default: 1.7.5
        type: string
    secrets:
      backend_config_b64:
        description: Base64-encoded non-logged S3 backend configuration.
        required: true
      infracost_api_key:
        description: Environment-scoped Infracost API key.
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: plan-and-cost-diff
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-plan-${{ github.repository }}-${{ inputs.working_directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Check out immutable caller revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Acquire short-lived plan credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ inputs.aws_plan_role_arn }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: true

      - name: Materialize backend configuration only in runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.backend_config_b64 }}' | base64 --decode > "$RUNNER_TEMP/backend.hcl"
          chmod 600 "$RUNNER_TEMP/backend.hcl"

      - name: Create base-ref worktree for cost comparison
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "${{ inputs.base_ref }}"

      - name: Plan base revision without applying it
        shell: bash
        working-directory: ${{ runner.temp }}/base/${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform plan -input=false -lock-timeout=5m -no-color -out="$RUNNER_TEMP/base.tfplan"
          terraform show -json "$RUNNER_TEMP/base.tfplan" > "$RUNNER_TEMP/base.tfplan.json"

      - name: Plan pull-request revision without applying it
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform plan -input=false -lock-timeout=5m -no-color -out="$RUNNER_TEMP/head.tfplan"
          terraform show -json "$RUNNER_TEMP/head.tfplan" > "$RUNNER_TEMP/head.tfplan.json"

      - name: Set up Infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.3
        with:
          api-key: ${{ secrets.infracost_api_key }}

      - name: Calculate base and pull-request cost estimates
        shell: bash
        run: |
          set -euo pipefail
          infracost breakdown --path="$RUNNER_TEMP/base.tfplan.json" --format=json --out-file="$RUNNER_TEMP/infracost-base.json"
          infracost diff --path="$RUNNER_TEMP/head.tfplan.json" --compare-to="$RUNNER_TEMP/infracost-base.json" --format=json --out-file="$RUNNER_TEMP/infracost-diff.json"

      - name: Update the pull-request cost-diff comment
        shell: bash
        run: |
          set -euo pipefail
          infracost comment github --path="$RUNNER_TEMP/infracost-diff.json" --repo="$GITHUB_REPOSITORY" --github-token="$GITHUB_TOKEN" --pull-request="${{ inputs.pull_request_number }}" --behavior=update
        env:
          GITHUB_TOKEN: ${{ github.token }}
