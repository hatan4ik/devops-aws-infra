# Template only. Place in a standalone terraform-aws-* module repository after
# the pipeline repository is approved. Tags must be annotated, immutable, and
# GitHub-verified before this workflow is enabled.
name: module-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    uses: <org>/terraform-pipelines/.github/workflows/module-release.yml@<FULL_40_CHAR_COMMIT_SHA>
    with:
      release_tag: ${{ github.ref_name }}
      module_directory: .
