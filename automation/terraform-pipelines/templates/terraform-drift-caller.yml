# Template only. Select a frequency and alert route after operational approval.
# A non-zero workflow result is the drift signal; it never changes AWS.
name: terraform-drift

on:
  schedule:
    - cron: "17 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    uses: <org>/terraform-pipelines/.github/workflows/terraform-drift.yml@<FULL_40_CHAR_COMMIT_SHA>
    with:
      working_directory: <ROOT_DIRECTORY>
      aws_region: <AWS_REGION>
      aws_drift_role_arn: <DRIFT_ROLE_ARN>
    secrets:
      backend_config_b64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
