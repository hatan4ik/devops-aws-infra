AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  RETIRED historical sandbox-platform delivery policies. This template is used
  only to set Retain metadata before Terraform adoption deletes the stack.

Parameters:
  RoleNamePrefix:
    Type: String
    Description: Existing GitHub OIDC role-name prefix in this account.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,40}$'
  StateBucketName:
    Type: String
    Description: Existing encrypted Terraform-state S3 bucket name.
  StateKeyPrefix:
    Type: String
    Description: Prefix reserved exclusively for this root's state object.
    AllowedPattern: '^[A-Za-z0-9!_.*''()/\-]+/$'
  StateKmsKeyArn:
    Type: String
    Description: Existing KMS CMK ARN that encrypts the state object.
    AllowedPattern: '^arn:[^:]+:kms:[^:]+:[0-9]{12}:key/.+$'
  StateLockTableArn:
    Type: String
    Description: Existing DynamoDB lock table ARN.
    AllowedPattern: '^arn:[^:]+:dynamodb:[^:]+:[0-9]{12}:table/[A-Za-z0-9_.-]+$'

Resources:
  SandboxPlatformPlanPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: !Sub '${RoleNamePrefix}-sandbox-platform-plan'
      Description: Read and state-lock access required to plan or detect drift for the sandbox-platform root.
      Roles:
        - !Sub '${RoleNamePrefix}-plan'
        - !Sub '${RoleNamePrefix}-drift'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListOnlySandboxPlatformStatePrefix
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}'
            Condition:
              StringLike:
                s3:prefix: !Sub '${StateKeyPrefix}*'
          - Sid: ReadAndWriteOnlySandboxPlatformStateObject
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}/${StateKeyPrefix}*'
          - Sid: UseOnlyTheStateEncryptionKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Ref StateKmsKeyArn
          - Sid: LockOnlyTheDedicatedStateTable
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !Ref StateLockTableArn
          - Sid: ReadSandboxPlatformResources
            Effect: Allow
            Action:
              - cognito-idp:DescribeUserPool
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:ListResourceServers
              - cognito-idp:ListTagsForResource
              - cognito-idp:ListUserPoolClients
              - cognito-idp:ListUserPools
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:ListTables
              - dynamodb:ListTagsOfResource
              - ec2:Describe*
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:GetLifecyclePolicy
              - ecr:GetRepositoryPolicy
              - ecr:ListImages
              - ecr:ListTagsForResource
              - ecs:DescribeClusters
              - ecs:ListClusters
              - ecs:ListTagsForResource
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
              - tag:GetResources
            Resource: '*'

  SandboxPlatformApplyPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: !Sub '${RoleNamePrefix}-sandbox-platform-dev-apply'
      Description: Root-specific platform provisioning and state access for the protected sandbox dev environment.
      Roles:
        - !Sub '${RoleNamePrefix}-dev-apply'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListOnlySandboxPlatformStatePrefix
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}'
            Condition:
              StringLike:
                s3:prefix: !Sub '${StateKeyPrefix}*'
          - Sid: ReadAndWriteOnlySandboxPlatformStateObject
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}/${StateKeyPrefix}*'
          - Sid: UseOnlyTheStateEncryptionKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Ref StateKmsKeyArn
          - Sid: LockOnlyTheDedicatedStateTable
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !Ref StateLockTableArn
          - Sid: ReadSandboxPlatformResources
            Effect: Allow
            Action:
              - cognito-idp:DescribeUserPool
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:ListResourceServers
              - cognito-idp:ListTagsForResource
              - cognito-idp:ListUserPoolClients
              - cognito-idp:ListUserPools
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:ListTables
              - dynamodb:ListTagsOfResource
              - ec2:Describe*
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:GetLifecyclePolicy
              - ecr:GetRepositoryPolicy
              - ecr:ListImages
              - ecr:ListTagsForResource
              - ecs:DescribeClusters
              - ecs:ListClusters
              - ecs:ListTagsForResource
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
              - tag:GetResources
            Resource: '*'
          - Sid: ManageSandboxPrivateConnectivity
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateSecurityGroup
              - ec2:CreateTags
              - ec2:CreateVpcEndpoint
              - ec2:DeleteSecurityGroup
              - ec2:DeleteTags
              - ec2:DeleteVpcEndpoints
              - ec2:ModifyVpcEndpoint
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
            Resource: '*'
          - Sid: ManageSandboxContainerRegistry
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteLifecyclePolicy
              - ecr:DeleteRepository
              - ecr:PutImageScanningConfiguration
              - ecr:PutImageTagMutability
              - ecr:PutLifecyclePolicy
              - ecr:TagResource
              - ecr:UntagResource
            Resource: '*'
          - Sid: ManageSandboxEcsCluster
            Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:DeleteCluster
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:UpdateCluster
            Resource: '*'
          - Sid: ManageSandboxApplicationLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/sandbox-platform-dev/*'
          - Sid: CreateDedicatedSandboxPlatformDataKey
            Effect: Allow
            Action:
              - kms:CreateKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Root: sandbox-platform
          - Sid: ManageDedicatedSandboxPlatformDataKey
            Effect: Allow
            Action:
              - kms:CreateGrant
              - kms:Decrypt
              - kms:DescribeKey
              - kms:EnableKeyRotation
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Root: sandbox-platform
          - Sid: ManageDedicatedSandboxPlatformDataAlias
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
            Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/sandbox-platform-dev-application-data'
          - Sid: ManageSandboxSessionTable
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:UpdateContinuousBackups
              - dynamodb:UpdateTable
              - dynamodb:UpdateTimeToLive
            Resource: '*'
          - Sid: ManageSandboxCognitoPool
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:DeleteUserPool
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
              - cognito-idp:UpdateUserPool
            Resource: '*'

Outputs:
  PlanPolicyArn:
    Description: Managed policy attached to the pull-request plan role.
    Value: !Ref SandboxPlatformPlanPolicy
  DriftPolicyArn:
    Description: Managed policy attached to the protected-environment drift role.
    Value: !Ref SandboxPlatformPlanPolicy
  ApplyPolicyArn:
    Description: Managed policy attached to the protected dev apply role.
    Value: !Ref SandboxPlatformApplyPolicy
