# Template only. Replace every <...> value after account vending, OIDC trust,
# protected environment, backend, and pipeline commit approval. This caller is
# intentionally a normal pull_request workflow; do not change it to
# pull_request_target or expose environment secrets to forked pull requests.
name: terraform-plan

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    uses: <org>/terraform-pipelines/.github/workflows/terraform-plan.yml@<FULL_40_CHAR_COMMIT_SHA>
    with:
      working_directory: <ROOT_DIRECTORY>
      aws_region: <AWS_REGION>
      aws_plan_role_arn: <PLAN_ROLE_ARN>
      base_ref: ${{ github.event.pull_request.base.sha }}
      pull_request_number: ${{ github.event.pull_request.number }}
    secrets:
      backend_config_b64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
      infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}
