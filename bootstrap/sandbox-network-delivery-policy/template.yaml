AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Least-privilege GitHub OIDC delivery policies for the approved isolated
  sandbox-network Terraform root. This stack attaches policies only to the
  permissionless roles created by bootstrap/github-oidc/template.yaml.

Parameters:
  RoleNamePrefix:
    Type: String
    Description: Existing GitHub OIDC role-name prefix in this account.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,40}$'
  StateBucketName:
    Type: String
    Description: Existing encrypted Terraform-state S3 bucket name.
  StateKeyPrefix:
    Type: String
    Description: Prefix reserved exclusively for this root's state object.
    AllowedPattern: '^[A-Za-z0-9!_.*''()/\-]+/$'
  StateKmsKeyArn:
    Type: String
    Description: Existing KMS CMK ARN that encrypts the state object.
    AllowedPattern: '^arn:[^:]+:kms:[^:]+:[0-9]{12}:key/.+$'
  StateLockTableArn:
    Type: String
    Description: Existing DynamoDB lock table ARN.
    AllowedPattern: '^arn:[^:]+:dynamodb:[^:]+:[0-9]{12}:table/[A-Za-z0-9_.-]+$'

Resources:
  SandboxNetworkPlanPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleNamePrefix}-sandbox-network-plan'
      Description: Read and state-lock access required to plan or detect drift for the sandbox-network root.
      Roles:
        - !Sub '${RoleNamePrefix}-plan'
        - !Sub '${RoleNamePrefix}-drift'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListOnlyTheSandboxNetworkStatePrefix
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}'
            Condition:
              StringLike:
                s3:prefix: !Sub '${StateKeyPrefix}*'
          - Sid: ReadAndWriteOnlyTheSandboxNetworkStateObject
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}/${StateKeyPrefix}*'
          - Sid: UseOnlyTheStateEncryptionKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Ref StateKmsKeyArn
          - Sid: LockOnlyTheDedicatedStateTable
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !Ref StateLockTableArn
          - Sid: ReadSandboxNetworkResources
            Effect: Allow
            Action:
              - ec2:Describe*
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
              - logs:Describe*
              - logs:ListTagsForResource
              - tag:GetResources
            Resource: '*'

  SandboxNetworkApplyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleNamePrefix}-sandbox-network-dev-apply'
      Description: Exact create, update, delete, state, and read access for the sandbox-network root.
      Roles:
        - !Sub '${RoleNamePrefix}-dev-apply'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListOnlyTheSandboxNetworkStatePrefix
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}'
            Condition:
              StringLike:
                s3:prefix: !Sub '${StateKeyPrefix}*'
          - Sid: ReadAndWriteOnlyTheSandboxNetworkStateObject
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${StateBucketName}/${StateKeyPrefix}*'
          - Sid: UseOnlyTheStateEncryptionKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Ref StateKmsKeyArn
          - Sid: LockOnlyTheDedicatedStateTable
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !Ref StateLockTableArn
          - Sid: ReadSandboxNetworkResources
            Effect: Allow
            Action:
              - ec2:Describe*
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
              - logs:Describe*
              - logs:ListTagsForResource
              - tag:GetResources
            Resource: '*'
          - Sid: ManageOnlyTheSandboxNetworkVpcResources
            Effect: Allow
            Action:
              - ec2:AssociateRouteTable
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateFlowLogs
              - ec2:CreateRouteTable
              - ec2:CreateSubnet
              - ec2:CreateTags
              - ec2:CreateVpc
              - ec2:CreateVpcEncryptionControl
              - ec2:DeleteFlowLogs
              - ec2:DeleteRouteTable
              - ec2:DeleteSubnet
              - ec2:DeleteTags
              - ec2:DeleteVpc
              - ec2:DeleteVpcEncryptionControl
              - ec2:DisassociateRouteTable
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:ModifyVpcEncryptionControl
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
            Resource: '*'
          - Sid: ManageSandboxNetworkFlowLogGroup
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/sandbox-network-dev/flow-logs*'
          - Sid: CreateDedicatedSandboxNetworkFlowLogKey
            Effect: Allow
            Action:
              - kms:CreateKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Root: sandbox-network
          - Sid: ManageOnlyTheDedicatedSandboxNetworkFlowLogAlias
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
            Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/sandbox-network-dev-flow-logs'
          - Sid: ManageDedicatedSandboxNetworkFlowLogKey
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Root: sandbox-network
          - Sid: CreateAndPassOnlyTheSandboxNetworkFlowLogRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sandbox-network-dev-vpc-flow-logs'

Outputs:
  PlanPolicyArn:
    Description: Managed policy attached to the pull-request plan role.
    Value: !Ref SandboxNetworkPlanPolicy
  DriftPolicyArn:
    Description: Read-only managed policy attached to the protected-environment drift role.
    Value: !Ref SandboxNetworkPlanPolicy
  ApplyPolicyArn:
    Description: Managed policy attached to the protected dev apply role.
    Value: !Ref SandboxNetworkApplyPolicy
